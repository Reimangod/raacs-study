<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="248" viewBox="0 0 1280 248" role="img" aria-labelledby="title description">
  <title id="title">RAACS sampling and classical CI workflow</title>
  <desc id="description">Molecular inputs and HF pilot samples feed a classical residual and resource rule. Candidate quantum circuits are sampled, classical CI selects up to four circuits, and reserved final samples produce a final classical CI readout. The selected bank feeds back to the proposal step within registered limits. Quantum steps were simulated without hardware noise.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#111"/></marker></defs>
  <rect width="1280" height="248" fill="#fff"/>
  <g stroke="#111" stroke-width="1.4">
    <rect x="16" y="28" width="224" height="126" rx="9" fill="#F1F6FC"/>
    <rect x="272" y="28" width="224" height="126" rx="9" fill="#FFF0EC"/>
    <rect x="528" y="28" width="224" height="126" rx="9" fill="#FFFBEA"/>
    <rect x="784" y="28" width="224" height="126" rx="9" fill="#FFF0EC"/>
    <rect x="1040" y="28" width="224" height="126" rx="9" fill="#F2F9F2"/>
    <g fill="none" marker-end="url(#arrow)">
      <path d="M240 91 H270"/><path d="M496 91 H526"/>
      <path d="M752 91 H782"/><path d="M1008 91 H1038"/>
      <path d="M896 154 V186 H384 V156"/>
    </g>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="18" font-weight="700">
      <text x="128" y="57">Molecular inputs</text><text x="384" y="57">Propose exchanges</text>
      <text x="640" y="57">Sample candidates</text><text x="896" y="57">Select circuit bank</text>
      <text x="1152" y="57">Final readout</text>
    </g>
    <g font-size="15">
      <text x="128" y="86">Integrals and electrons</text><text x="128" y="110">HF reference</text><text x="128" y="134">Initial model samples</text>
      <text x="384" y="86">Classical selected CI</text><text x="384" y="110">Residual priority</text><text x="384" y="134">CNOT and depth cost</text>
      <text x="640" y="86">Quantum step</text><text x="640" y="110">Fixed candidate angles</text><text x="640" y="134">Paid model samples</text>
      <text x="896" y="86">Classical CI scores</text><text x="896" y="110">At most four circuits</text><text x="896" y="134">Track the best bank</text>
      <text x="1152" y="86">Reserved final samples</text><text x="1152" y="110">Classical CI energy</text><text x="1152" y="134">Circuit resources and cost</text>
      <text x="640" y="211">Repeat within the registered construction limits</text>
      <text x="640" y="238">Quantum steps in this archive were simulated; actual hardware shots are zero</text>
    </g>
  </g>
</svg>
